<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Registro familiar</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#f5f4f0;--surface:#ffffff;--surface2:#f0efe9;--border:rgba(0,0,0,0.10);--border2:rgba(0,0,0,0.18);--text:#1a1a18;--text2:#6b6b66;--text3:#9e9e99;--green:#3B6D11;--green-bg:#EAF3DE;--blue:#185FA5;--red:#A32D2D;--red-bg:#FCEBEB;--amber:#854F0B;--amber-bg:#FAEEDA;--radius:12px;--radius-sm:8px;--font:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a18;--surface:#242422;--surface2:#2e2e2b;--border:rgba(255,255,255,0.10);--border2:rgba(255,255,255,0.18);--text:#f0efe9;--text2:#9e9e99;--text3:#6b6b66;--green:#a8d96a;--green-bg:#1e3308;--blue:#7eb8f5;--red:#f08080;--red-bg:#2e0e0e;--amber:#f5c878;--amber-bg:#2e1c04;}}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5;min-height:100vh;}
.app{max-width:700px;margin:0 auto;padding:1.25rem 1rem 3rem;}
.header{margin-bottom:1.25rem;}
.header h1{font-size:22px;font-weight:600;}
.header p{font-size:13px;color:var(--text2);margin-top:3px;}
.sync-row{display:flex;align-items:center;gap:6px;margin-top:4px;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);}
.sync-dot.ok{background:var(--green);}
.sync-dot.err{background:var(--red);}
.sync-dot.loading{background:var(--amber);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
.sync-label{font-size:11px;color:var(--text3);}
.tabs{display:flex;margin-bottom:1.5rem;border-bottom:1px solid var(--border);overflow-x:auto;}
.tab{padding:9px 15px;font-size:13px;cursor:pointer;border:none;background:none;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;font-family:var(--font);white-space:nowrap;flex-shrink:0;}
.tab.active{color:var(--text);border-bottom-color:var(--text);font-weight:600;}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:1.25rem;}
.metric{background:var(--surface2);border-radius:var(--radius-sm);padding:12px 14px;}
.metric-label{font-size:11px;color:var(--text2);margin-bottom:3px;}
.metric-value{font-size:16px;font-weight:600;line-height:1.3;}
.metric-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1.25rem;}
.card-title{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:12px;letter-spacing:0.05em;text-transform:uppercase;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.form-grid-3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:10px;}
.ff label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:500;}
.ff input,.ff select{width:100%;padding:9px 11px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;background:var(--surface2);color:var(--text);font-family:var(--font);-webkit-appearance:none;}
.ff input:focus,.ff select:focus{outline:none;border-color:var(--blue);}
.btn{padding:8px 16px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;cursor:pointer;background:none;color:var(--text);font-family:var(--font);}
.btn:hover{background:var(--surface2);}
.btn-primary{width:100%;padding:11px;background:var(--text);color:var(--surface);border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);margin-top:6px;}
.btn-primary:hover{opacity:0.85;}
.btn-sm{padding:4px 10px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;background:none;color:var(--text2);font-family:var(--font);}
.btn-danger{color:var(--red);border-color:rgba(162,45,45,0.3);}
.btn-danger:hover{background:var(--red-bg);}
.filter-row{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap;align-items:center;}
.filter-btn{padding:5px 13px;font-size:12px;border:1px solid var(--border2);border-radius:20px;cursor:pointer;background:none;color:var(--text2);font-family:var(--font);}
.filter-btn.active{background:var(--text);color:var(--surface);border-color:var(--text);}
.date-filters{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:center;}
.date-filters select,.date-filters input{padding:6px 10px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;background:var(--surface2);color:var(--text);font-family:var(--font);-webkit-appearance:none;}
.date-mode-btn{padding:5px 12px;font-size:12px;border:1px solid var(--border2);border-radius:20px;cursor:pointer;background:none;color:var(--text2);font-family:var(--font);}
.date-mode-btn.active{background:var(--text);color:var(--surface);border-color:var(--text);}
.record-list{display:flex;flex-direction:column;gap:8px;}
.record-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
.record-top{display:flex;align-items:flex-start;gap:12px;}
.rec-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.rec-main{flex:1;min-width:0;}
.rec-desc{font-size:14px;font-weight:500;}
.rec-meta{font-size:11px;color:var(--text2);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.rec-right{text-align:right;flex-shrink:0;}
.rec-amount{font-size:15px;font-weight:600;}
.rec-note{font-size:13px;color:var(--text2);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);line-height:1.5;}
.rec-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:8px;}
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:500;}
.cur-badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600;border:1px solid var(--border);}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.bar-label{font-size:12px;color:var(--text2);width:110px;flex-shrink:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-track{flex:1;height:7px;background:var(--surface2);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;transition:width 0.4s ease;}
.bar-val{font-size:11px;font-weight:500;min-width:80px;text-align:right;}
.empty{text-align:center;padding:3rem 1rem;color:var(--text3);font-size:14px;}
.config-section{margin-bottom:1.5rem;}
.config-section-title{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:10px;letter-spacing:0.05em;text-transform:uppercase;}
.config-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.config-row input{flex:1;padding:9px 11px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;background:var(--surface2);color:var(--text);font-family:var(--font);}
.add-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
.add-row input{flex:1;padding:7px 10px;border:1px dashed var(--border2);border-radius:var(--radius-sm);font-size:14px;background:none;color:var(--text);font-family:var(--font);}
.add-row input:focus{outline:none;border-color:var(--blue);border-style:solid;}
.msg{text-align:center;font-size:13px;min-height:18px;margin-top:8px;}
.msg.ok{color:var(--green);}.msg.err{color:var(--red);}
.banner{background:var(--amber-bg);border:1px solid rgba(133,79,11,0.2);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:1.25rem;font-size:13px;color:var(--amber);cursor:pointer;}
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:12px;color:var(--text2);font-size:14px;}
.spinner{width:28px;height:28px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:10px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;z-index:999;opacity:0;transition:opacity 0.2s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
.avatar{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;}
.check-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface2);border-radius:var(--radius-sm);margin-bottom:10px;cursor:pointer;}
.check-row input[type=checkbox]{width:18px;height:18px;cursor:pointer;flex-shrink:0;}
.check-row label{font-size:14px;color:var(--text);cursor:pointer;flex:1;}
.reemb-badge{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10px;font-weight:500;}
.reemb-si{background:#EAF3DE;color:#3B6D11;}
.reemb-no{background:#F1EFE8;color:#5F5E5A;}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;padding:1.5rem 1.25rem 2rem;width:100%;max-width:700px;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:17px;font-weight:600;margin-bottom:1.25rem;}
.modal-actions{display:flex;gap:8px;margin-top:1rem;}
.modal-actions .btn{flex:1;}
@media(min-width:600px){.modal-overlay{align-items:center;}.modal{border-radius:var(--radius);max-height:80vh;}}
@media(max-width:500px){.form-grid,.form-grid-3{grid-template-columns:1fr;}.metrics{grid-template-columns:1fr 1fr;}.app{padding:1rem 0.75rem 3rem;}}
</style>
</head>
<body>

<div id="loading-screen" class="loading-screen">
  <div class="spinner"></div>
  <span>Conectando...</span>
</div>

<div id="main-app" class="app" style="display:none">
  <div class="header">
    <h1 id="app-title">Registro familiar</h1>
    <p id="header-sub"></p>
    <div class="sync-row">
      <div class="sync-dot loading" id="sync-dot"></div>
      <span class="sync-label" id="sync-label">Conectando...</span>
    </div>
  </div>
  <div id="banner" class="banner" style="display:none" onclick="showTab('config')">
    ⚠️ Configurá tu nombre antes de registrar — tocá aquí.
  </div>
  <div class="tabs">
    <button class="tab active" onclick="showTab('resumen')">Resumen</button>
    <button class="tab" onclick="showTab('nuevo')">Nuevo registro</button>
    <button class="tab" onclick="showTab('historial')">Historial</button>
    <button class="tab" onclick="showTab('config')">Configuración</button>
  </div>

  <!-- RESUMEN -->
  <div id="tab-resumen">
    <div class="metrics" id="metrics"></div>
    <div class="card"><div class="card-title">Por categoría</div><div id="cat-bars"></div></div>
    <div class="card"><div class="card-title">Por persona</div><div id="person-bars"></div></div>
  </div>

  <!-- NUEVO REGISTRO -->
  <div id="tab-nuevo" style="display:none">
    <div class="card">
      <div class="form-grid-3">
        <div class="ff"><label>Descripción</label><input type="text" id="f-desc" placeholder="Ej: Supermercado"/></div>
        <div class="ff"><label>Monto <span style="font-size:11px;color:var(--text3)">(opcional)</span></label><input type="number" id="f-amount" placeholder="0" min="0" step="0.01"/></div>
        <div class="ff"><label>Moneda</label><select id="f-currency"></select></div>
      </div>
      <div class="form-grid">
        <div class="ff"><label>Categoría</label><select id="f-cat"></select></div>
        <div class="ff"><label>Fecha</label><input type="date" id="f-date"/></div>
      </div>
      <div style="margin-bottom:10px">
        <div class="ff"><label>Notas <span style="font-size:11px;color:var(--text3)">(opcional)</span></label><input type="text" id="f-note" placeholder="Observaciones..."/></div>
      </div>
      <div class="check-row" onclick="toggleCheck('f-reembolsable')">
        <input type="checkbox" id="f-reembolsable"/>
        <label for="f-reembolsable">Reembolsable</label>
      </div>
      <div id="f-user-info" style="font-size:13px;color:var(--text2);margin-bottom:8px;padding:8px 12px;background:var(--surface2);border-radius:var(--radius-sm);"></div>
      <button class="btn-primary" onclick="addRecord()">Guardar registro</button>
      <div id="form-msg" class="msg"></div>
    </div>
  </div>

  <!-- HISTORIAL -->
  <div id="tab-historial" style="display:none">
    <div class="date-filters" id="date-filters">
      <button class="date-mode-btn active" id="btn-mes" onclick="setDateMode('mes')">Por mes</button>
      <button class="date-mode-btn" id="btn-rango" onclick="setDateMode('rango')">Rango</button>
      <div id="date-controls"></div>
    </div>
    <div class="filter-row" id="hist-filters"></div>
    <div id="hist-count" style="font-size:12px;color:var(--text3);margin-bottom:8px;"></div>
    <div class="record-list" id="record-list"></div>
  </div>

  <!-- CONFIGURACIÓN -->
  <div id="tab-config" style="display:none">
    <div class="card">
      <div class="config-section">
        <div class="config-section-title">Mi nombre</div>
        <div class="config-row">
          <input type="text" id="cfg-username" placeholder="Tu nombre (ej: Martín)" onchange="updateUsername(this.value)"/>
        </div>
        <p style="font-size:12px;color:var(--text3);margin-top:4px;">Todos tus registros quedan asociados a este nombre.</p>
      </div>
      <div class="config-section">
        <div class="config-section-title">Preferencias</div>
        <div class="check-row" onclick="toggleDefaultReemb()">
          <input type="checkbox" id="cfg-reembolsable"/>
          <label for="cfg-reembolsable">Marcar reembolsable por defecto en nuevos registros</label>
        </div>
      </div>
      <div class="config-section">
        <div class="config-section-title">Nombre de la app</div>
        <div class="config-row">
          <input type="text" id="cfg-title" placeholder="Ej: Gastos del hogar" onchange="updateAppTitle(this.value)"/>
        </div>
      </div>
      <div class="config-section">
        <div class="config-section-title">Monedas</div>
        <div id="currencies-config"></div>
        <div class="add-row">
          <input type="text" id="new-cur-code" placeholder="Código (ej: BRL)" style="max-width:120px;flex-shrink:0;text-transform:uppercase;"/>
          <input type="text" id="new-cur-symbol" placeholder="Símbolo (ej: R$)" style="max-width:90px;flex-shrink:0;"/>
          <input type="text" id="new-cur-name" placeholder="Nombre"/>
          <button class="btn" onclick="addCurrency()">+ Agregar</button>
        </div>
      </div>
      <div class="config-section" style="margin-bottom:0">
        <div class="config-section-title">Categorías</div>
        <div id="cats-config"></div>
        <div class="add-row">
          <input type="text" id="new-cat-icon" placeholder="🏷" style="max-width:52px;flex-shrink:0;text-align:center;font-size:18px;"/>
          <input type="text" id="new-cat-name" placeholder="Nueva categoría..."/>
          <button class="btn" onclick="addCategory()">+ Agregar</button>
        </div>
      </div>
      <div id="config-msg" class="msg" style="margin-top:14px;"></div>
    </div>
  </div>
</div>

<!-- MODAL EDICIÓN -->
<div id="edit-modal" class="modal-overlay" style="display:none" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-title">Editar registro</div>
    <div class="form-grid-3">
      <div class="ff"><label>Descripción</label><input type="text" id="e-desc"/></div>
      <div class="ff"><label>Monto</label><input type="number" id="e-amount" min="0" step="0.01"/></div>
      <div class="ff"><label>Moneda</label><select id="e-currency"></select></div>
    </div>
    <div class="form-grid">
      <div class="ff"><label>Categoría</label><select id="e-cat"></select></div>
      <div class="ff"><label>Fecha</label><input type="date" id="e-date"/></div>
    </div>
    <div style="margin-bottom:10px">
      <div class="ff"><label>Notas</label><input type="text" id="e-note" placeholder="Observaciones..."/></div>
    </div>
    <div class="check-row" onclick="toggleCheck('e-reembolsable')">
      <input type="checkbox" id="e-reembolsable"/>
      <label for="e-reembolsable">Reembolsable</label>
    </div>
    <div id="edit-msg" class="msg"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" style="margin-top:0" onclick="saveEdit()">Guardar cambios</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, addDoc, deleteDoc, updateDoc, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyCDGDaGmZ9XdXJXvSqTRTeDATFDUIaPfZM",
  authDomain: "gastos-familiares-a8055.firebaseapp.com",
  projectId: "gastos-familiares-a8055",
  storageBucket: "gastos-familiares-a8055.firebasestorage.app",
  messagingSenderId: "189480541992",
  appId: "1:189480541992:web:19b59db6272872a3303a1d"
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

const AV=[{bg:'#E6F1FB',c:'#185FA5'},{bg:'#EAF3DE',c:'#3B6D11'},{bg:'#FAEEDA',c:'#854F0B'},{bg:'#FBEAF0',c:'#993556'},{bg:'#EEEDFE',c:'#534AB7'},{bg:'#F1EFE8',c:'#5F5E5A'},{bg:'#FCEBEB',c:'#A32D2D'},{bg:'#E1F5EE',c:'#0F6E56'}];
const BC=['#378ADD','#639922','#BA7517','#D4537E','#7F77DD','#888780','#E24B4A','#1D9E75'];
const CC=['#3B6D11','#185FA5','#854F0B','#A32D2D','#534AB7','#993556','#5F5E5A','#0F6E56'];
const CB=['#EAF3DE','#E6F1FB','#FAEEDA','#FCEBEB','#EEEDFE','#FBEAF0','#F1EFE8','#E1F5EE'];
const CRC=['#185FA5','#3B6D11','#534AB7','#854F0B','#993556','#A32D2D'];
const CRB=['#E6F1FB','#EAF3DE','#EEEDFE','#FAEEDA','#FBEAF0','#FCEBEB'];

let cfg={appTitle:'Registro familiar',currencies:[{id:'uyu',code:'UYU',symbol:'$U',name:'Peso uruguayo'},{id:'usd',code:'USD',symbol:'US$',name:'Dólar'},{id:'eur',code:'EUR',symbol:'€',name:'Euro'}],categories:[{id:'c1',name:'Comida',icon:'🍽'},{id:'c2',name:'Hogar',icon:'🏠'},{id:'c3',name:'Transporte',icon:'🚌'},{id:'c4',name:'Salud',icon:'💊'},{id:'c5',name:'Educación',icon:'📚'},{id:'c6',name:'Ocio',icon:'🎮'},{id:'c7',name:'Otros',icon:'📦'}]};
let username=localStorage.getItem('rf_username')||'';
let defaultReembolsable=localStorage.getItem('rf_default_reemb')==='true';
let records=[];
let FP='all';
let dateMode='mes';
let selMonth='';
let rangeFrom='';
let rangeTo='';
let editingId=null;

const cfgRef=doc(db,'app','config');
const recRef=collection(db,'records');

// Helpers
const catBy=id=>cfg.categories.find(c=>c.id===id)||{name:'Otros',icon:'📦'};
const catCI=id=>{const i=cfg.categories.findIndex(c=>c.id===id);return i>=0?i%CC.length:0;};
const curBy=id=>cfg.currencies.find(c=>c.id===id)||{code:'?',symbol:'?',name:'?'};
const curCI=id=>{const i=cfg.currencies.findIndex(c=>c.id===id);return i>=0?i%CRC.length:0;};
const fD=n=>(Math.round(n*100)/100).toLocaleString('es-UY',{minimumFractionDigits:2,maximumFractionDigits:2});
const fN=n=>Math.round(n).toLocaleString('es-UY');
const fDate=d=>new Date(d+'T12:00:00').toLocaleDateString('es-UY',{day:'2-digit',month:'short',year:'2-digit'});
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const byCur=rs=>{const m={};rs.forEach(r=>{if(r.amount>0)m[r.curId]=(m[r.curId]||0)+r.amount;});return m;};
function uColor(name){let h=0;for(let i=0;i<name.length;i++)h=name.charCodeAt(i)+((h<<5)-h);return AV[Math.abs(h)%AV.length];}
function allOwners(){return[...new Set(records.map(r=>r.owner))].filter(Boolean);}
function setSyncStatus(s,l){document.getElementById('sync-dot').className='sync-dot '+s;document.getElementById('sync-label').textContent=l;}
function nowYM(){const n=new Date();return n.getFullYear()+'-'+(String(n.getMonth()+1).padStart(2,'0'));}

function filteredRecords(){
  let r=FP==='all'?records:records.filter(x=>x.owner===FP.slice(2));
  if(dateMode==='mes'){
    const ym=selMonth||nowYM();
    r=r.filter(x=>x.date&&x.date.slice(0,7)===ym);
  } else {
    if(rangeFrom)r=r.filter(x=>x.date>=rangeFrom);
    if(rangeTo)r=r.filter(x=>x.date<=rangeTo);
  }
  return r.sort((a,b)=>new Date(b.date)-new Date(a.date));
}

async function saveCfg(){setSyncStatus('loading','Guardando...');try{await setDoc(cfgRef,cfg);setSyncStatus('ok','Sincronizado');}catch(e){setSyncStatus('err','Error al guardar');}}

function renderAll(){
  const t=cfg.appTitle||'Registro familiar';
  document.getElementById('app-title').textContent=t;
  document.getElementById('cfg-title').value=t;
  document.getElementById('cfg-username').value=username||'';
  document.getElementById('header-sub').textContent=username?'Hola, '+username:'Configurá tu nombre';
  document.getElementById('banner').style.display=username?'none':'block';
  document.getElementById('f-user-info').innerHTML=username?'Registrado como <strong>'+esc(username)+'</strong>':'<span style="color:var(--red)">Configurá tu nombre primero</span>';
  document.getElementById('f-reembolsable').checked=defaultReembolsable;
  document.getElementById('cfg-reembolsable').checked=defaultReembolsable;
  renderMetrics();renderCatBars();renderPersonBars();buildSelects();renderDateControls();renderFilters();renderList();renderConfig();
}

function renderMetrics(){
  const now=new Date();
  const mes=records.filter(r=>{const d=new Date(r.date+'T12:00');return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();});
  const totStr=Object.entries(byCur(records)).map(([id,v])=>curBy(id).symbol+' '+fN(v)).join(' + ')||'—';
  document.getElementById('metrics').innerHTML=`
    <div class="metric"><div class="metric-label">Total histórico</div><div class="metric-value" style="font-size:13px;line-height:1.6">${totStr}</div><div class="metric-sub">${records.length} registros</div></div>
    <div class="metric"><div class="metric-label">Este mes</div><div class="metric-value">${mes.length}</div><div class="metric-sub">registros</div></div>
    <div class="metric"><div class="metric-label">Mis registros</div><div class="metric-value">${records.filter(r=>r.owner===username).length}</div><div class="metric-sub">cargados</div></div>
    <div class="metric"><div class="metric-label">Personas</div><div class="metric-value">${allOwners().length}</div><div class="metric-sub">registrando</div></div>`;
}

function renderCatBars(){
  const map={};records.filter(r=>r.amount>0).forEach(r=>{if(!map[r.catId])map[r.catId]={};map[r.catId][r.curId]=(map[r.catId][r.curId]||0)+r.amount;});
  const entries=Object.entries(map);
  if(!entries.length){document.getElementById('cat-bars').innerHTML='<div class="empty">Sin datos aún</div>';return;}
  const tots=entries.map(([,m])=>Object.values(m).reduce((s,v)=>s+v,0));const max=Math.max(...tots,1);
  document.getElementById('cat-bars').innerHTML=entries.map(([catId,bc],i)=>{const cat=catBy(catId),ci=catCI(catId);return`<div class="bar-row"><div class="bar-label">${cat.icon} ${cat.name}</div><div class="bar-track"><div class="bar-fill" style="width:${(tots[i]/max*100).toFixed(1)}%;background:${CC[ci]}"></div></div><div class="bar-val">${Object.entries(bc).map(([id,v])=>curBy(id).symbol+' '+fN(v)).join(' · ')}</div></div>`;}).join('');
}

function renderPersonBars(){
  const owners=allOwners();
  const tots=owners.map(name=>Object.values(byCur(records.filter(r=>r.owner===name&&r.amount>0))).reduce((s,v)=>s+v,0));
  const max=Math.max(...tots,1);
  document.getElementById('person-bars').innerHTML=owners.length?owners.map((name,i)=>{const av=uColor(name);const vals=Object.entries(byCur(records.filter(r=>r.owner===name&&r.amount>0))).map(([id,v])=>curBy(id).symbol+' '+fN(v)).join(' · ')||'—';return`<div class="bar-row"><div class="bar-label" style="display:flex;align-items:center;gap:5px;justify-content:flex-end"><span class="avatar" style="background:${av.bg};color:${av.c};width:18px;height:18px;font-size:9px">${name.slice(0,2).toUpperCase()}</span>${esc(name)}</div><div class="bar-track"><div class="bar-fill" style="width:${(tots[i]/max*100).toFixed(1)}%;background:${BC[i%BC.length]}"></div></div><div class="bar-val">${vals}</div></div>`;}).join(''):'<div class="empty">Sin datos aún</div>';
}

function buildSelects(){
  ['f-cat','e-cat'].forEach(id=>{const el=document.getElementById(id),v=el.value;el.innerHTML=cfg.categories.map(c=>`<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');if(v&&cfg.categories.find(c=>c.id===v))el.value=v;});
  ['f-currency','e-currency'].forEach(id=>{const el=document.getElementById(id),v=el.value;el.innerHTML=cfg.currencies.map(c=>`<option value="${c.id}">${c.code} — ${c.symbol}</option>`).join('');if(v&&cfg.currencies.find(c=>c.id===v))el.value=v;});
}

function renderDateControls(){
  const ctrl=document.getElementById('date-controls');
  if(dateMode==='mes'){
    // Build month options from records + current month
    const months=new Set([nowYM(),...records.map(r=>r.date?r.date.slice(0,7):'').filter(Boolean)]);
    const sorted=[...months].sort((a,b)=>b.localeCompare(a));
    const cur=selMonth||nowYM();
    ctrl.innerHTML=`<select onchange="setMonth(this.value)" style="padding:6px 10px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;background:var(--surface2);color:var(--text);font-family:var(--font);">${sorted.map(m=>{const[y,mo]=m.split('-');const label=new Date(+y,+mo-1,1).toLocaleDateString('es-UY',{month:'long',year:'numeric'});return`<option value="${m}"${m===cur?' selected':''}>${label}</option>`;}).join('')}</select>`;
  } else {
    ctrl.innerHTML=`<input type="date" id="range-from" value="${rangeFrom}" onchange="setRange()" style="padding:6px 10px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;background:var(--surface2);color:var(--text);font-family:var(--font);"/>
    <span style="font-size:12px;color:var(--text3)">hasta</span>
    <input type="date" id="range-to" value="${rangeTo}" onchange="setRange()" style="padding:6px 10px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;background:var(--surface2);color:var(--text);font-family:var(--font);"/>`;
  }
}

function renderFilters(){
  const owners=allOwners();
  const btns=[{l:'Todos',v:'all'},...owners.map(name=>({l:name,v:'o_'+name}))];
  document.getElementById('hist-filters').innerHTML=btns.map(b=>`<button class="filter-btn${FP===b.v?' active':''}" onclick="setFilter('${b.v}',this)">${b.l}</button>`).join('');
}

function renderList(){
  const filtered=filteredRecords();
  document.getElementById('hist-count').textContent=filtered.length+' registro'+(filtered.length!==1?'s':'');
  if(!filtered.length){document.getElementById('record-list').innerHTML='<div class="empty">No hay registros en este período</div>';return;}
  document.getElementById('record-list').innerHTML=filtered.map(r=>{
    const cat=catBy(r.catId),ci=catCI(r.catId),cur=curBy(r.curId),cri=curCI(r.curId),av=uColor(r.owner||'?');
    const isMine=r.owner===username;
    return`<div class="record-item"><div class="record-top"><div class="rec-icon" style="background:${CB[ci]}">${cat.icon}</div><div class="rec-main"><div class="rec-desc">${esc(r.desc)}</div><div class="rec-meta"><span class="badge" style="background:${CB[ci]};color:${CC[ci]}">${cat.name}</span>${r.amount>0?`<span class="cur-badge" style="background:${CRB[cri]};color:${CRC[cri]}">${cur.code}</span>`:''}<span style="display:inline-flex;align-items:center;gap:4px"><span class="avatar" style="background:${av.bg};color:${av.c};width:18px;height:18px;font-size:9px">${(r.owner||'?').slice(0,2).toUpperCase()}</span>${esc(r.owner||'?')}</span>${fDate(r.date)}<span class="reemb-badge ${r.reembolsable?'reemb-si':'reemb-no'}">${r.reembolsable?'Reembolsable':'No reembolsable'}</span></div>${r.note?`<div class="rec-note">${esc(r.note)}</div>`:''}</div><div class="rec-right">${r.amount>0?`<div class="rec-amount">${cur.symbol} ${fD(r.amount)}</div>`:''}</div></div>${isMine?`<div class="rec-actions"><button class="btn-sm" onclick="openEdit('${r.id}')">Editar</button><button class="btn-sm btn-danger" onclick="delRecord('${r.id}')">Eliminar</button></div>`:''}</div>`;
  }).join('');
}

function renderConfig(){
  document.getElementById('currencies-config').innerHTML=cfg.currencies.map((c,i)=>`<div class="config-row"><span class="cur-badge" style="background:${CRB[i%CRB.length]};color:${CRC[i%CRC.length]};font-size:12px;padding:4px 8px;flex-shrink:0">${c.code}</span><input type="text" value="${esc(c.symbol)}" onchange="updCurSym('${c.id}',this.value)" style="max-width:75px;flex-shrink:0;"/><input type="text" value="${esc(c.name)}" onchange="updCurName('${c.id}',this.value)"/>${cfg.currencies.length>1?`<button class="btn-sm btn-danger" onclick="delCur('${c.id}')">Eliminar</button>`:''}</div>`).join('');
  document.getElementById('cats-config').innerHTML=cfg.categories.map(c=>`<div class="config-row"><input type="text" value="${c.icon}" onchange="updCatIcon('${c.id}',this.value)" style="width:46px;flex-shrink:0;text-align:center;font-size:18px;padding:5px 4px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);font-family:var(--font);"/><input type="text" value="${esc(c.name)}" onchange="updCatName('${c.id}',this.value)" style="flex:1;padding:7px 10px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;background:var(--surface2);color:var(--text);font-family:var(--font);"/>${cfg.categories.length>1?`<button class="btn-sm btn-danger" onclick="delCat('${c.id}')">Eliminar</button>`:''}</div>`).join('');
}

// Actions
window.addRecord=async()=>{
  const desc=document.getElementById('f-desc').value.trim(),amount=parseFloat(document.getElementById('f-amount').value)||0,curId=document.getElementById('f-currency').value,catId=document.getElementById('f-cat').value,date=document.getElementById('f-date').value,note=document.getElementById('f-note').value.trim(),reembolsable=document.getElementById('f-reembolsable').checked,msg=document.getElementById('form-msg');
  if(!username){msg.className='msg err';msg.textContent='Primero configurá tu nombre.';return;}
  if(!desc){msg.className='msg err';msg.textContent='Ingresá una descripción.';return;}
  if(!date){msg.className='msg err';msg.textContent='Seleccioná una fecha.';return;}
  msg.className='msg';msg.textContent='Guardando...';
  try{await addDoc(recRef,{desc,amount,curId,catId,date,note,reembolsable,owner:username,createdAt:Date.now()});document.getElementById('f-desc').value='';document.getElementById('f-amount').value='';document.getElementById('f-note').value='';document.getElementById('f-reembolsable').checked=defaultReembolsable;msg.className='msg ok';msg.textContent='Registro guardado.';setTimeout(()=>{msg.textContent='';},2000);}
  catch(e){msg.className='msg err';msg.textContent='Error al guardar.';}
};

window.delRecord=async id=>{
  try{await deleteDoc(doc(db,'records',id));toast('Registro eliminado');}
  catch(e){toast('Error al eliminar');}
};

window.openEdit=id=>{
  const r=records.find(x=>x.id===id);if(!r)return;
  editingId=id;
  buildSelects();
  document.getElementById('e-desc').value=r.desc||'';
  document.getElementById('e-amount').value=r.amount||'';
  document.getElementById('e-currency').value=r.curId||'';
  document.getElementById('e-cat').value=r.catId||'';
  document.getElementById('e-date').value=r.date||'';
  document.getElementById('e-note').value=r.note||'';
  document.getElementById('e-reembolsable').checked=r.reembolsable||false;
  document.getElementById('edit-msg').textContent='';
  document.getElementById('edit-modal').style.display='flex';
  document.body.style.overflow='hidden';
};

window.closeModal=()=>{
  document.getElementById('edit-modal').style.display='none';
  document.body.style.overflow='';
  editingId=null;
};

window.closeModalOutside=e=>{if(e.target===document.getElementById('edit-modal'))closeModal();};

window.saveEdit=async()=>{
  if(!editingId)return;
  const desc=document.getElementById('e-desc').value.trim(),amount=parseFloat(document.getElementById('e-amount').value)||0,curId=document.getElementById('e-currency').value,catId=document.getElementById('e-cat').value,date=document.getElementById('e-date').value,note=document.getElementById('e-note').value.trim(),reembolsable=document.getElementById('e-reembolsable').checked,msg=document.getElementById('edit-msg');
  if(!desc){msg.className='msg err';msg.textContent='Ingresá una descripción.';return;}
  if(!date){msg.className='msg err';msg.textContent='Seleccioná una fecha.';return;}
  msg.className='msg';msg.textContent='Guardando...';
  try{
    await updateDoc(doc(db,'records',editingId),{desc,amount,curId,catId,date,note,reembolsable});
    closeModal();toast('Registro actualizado');
  }catch(e){msg.className='msg err';msg.textContent='Error al guardar.';}
};

window.setDateMode=mode=>{
  dateMode=mode;
  document.getElementById('btn-mes').classList.toggle('active',mode==='mes');
  document.getElementById('btn-rango').classList.toggle('active',mode==='rango');
  renderDateControls();renderList();
};
window.setMonth=v=>{selMonth=v;renderList();};
window.setRange=()=>{rangeFrom=document.getElementById('range-from').value;rangeTo=document.getElementById('range-to').value;renderList();};
window.setFilter=(f,btn)=>{FP=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderList();};
window.showTab=t=>{['resumen','nuevo','historial','config'].forEach(id=>{document.getElementById('tab-'+id).style.display=id===t?'':'none';document.querySelector('.tab[onclick="showTab(\''+id+'\')"]').classList.toggle('active',id===t);});};
window.toggleCheck=id=>{const el=document.getElementById(id);el.checked=!el.checked;};
window.toggleDefaultReemb=()=>{defaultReembolsable=!defaultReembolsable;localStorage.setItem('rf_default_reemb',defaultReembolsable);document.getElementById('cfg-reembolsable').checked=defaultReembolsable;cfgMsg('Preferencia guardada.','ok');};
window.updateUsername=v=>{v=v.trim();if(!v)return;username=v;localStorage.setItem('rf_username',v);renderAll();cfgMsg('Nombre guardado.','ok');};
window.updateAppTitle=v=>{v=v.trim();if(!v)return;cfg.appTitle=v;saveCfg();renderAll();};
window.updCurSym=(id,v)=>{const c=cfg.currencies.find(x=>x.id===id);if(c){c.symbol=v||c.symbol;saveCfg();renderAll();}};
window.updCurName=(id,v)=>{v=v.trim();if(!v)return;const c=cfg.currencies.find(x=>x.id===id);if(c){c.name=v;saveCfg();renderAll();cfgMsg('Moneda actualizada.','ok');}};
window.updCatName=(id,v)=>{v=v.trim();if(!v)return;const c=cfg.categories.find(x=>x.id===id);if(c){c.name=v;saveCfg();renderAll();cfgMsg('Categoría actualizada.','ok');}};
window.updCatIcon=(id,v)=>{const c=cfg.categories.find(x=>x.id===id);if(c){c.icon=v||'📦';saveCfg();renderAll();}};
window.delCur=id=>{if(cfg.currencies.length<=1){cfgMsg('Debe quedar al menos una moneda.','err');return;}if(records.some(r=>r.curId===id)){cfgMsg('Hay registros con esta moneda.','err');return;}cfg.currencies=cfg.currencies.filter(c=>c.id!==id);saveCfg();renderAll();cfgMsg('Moneda eliminada.','ok');};
window.delCat=id=>{if(cfg.categories.length<=1){cfgMsg('Debe quedar al menos una categoría.','err');return;}if(records.some(r=>r.catId===id)){cfgMsg('Hay registros con esta categoría.','err');return;}cfg.categories=cfg.categories.filter(c=>c.id!==id);saveCfg();renderAll();cfgMsg('Categoría eliminada.','ok');};
window.addCurrency=()=>{const code=document.getElementById('new-cur-code').value.trim().toUpperCase(),sym=document.getElementById('new-cur-symbol').value.trim(),name=document.getElementById('new-cur-name').value.trim();if(!code||!sym||!name){cfgMsg('Completá código, símbolo y nombre.','err');return;}if(cfg.currencies.find(c=>c.code===code)){cfgMsg('Ya existe esa moneda.','err');return;}cfg.currencies.push({id:'cur'+Date.now().toString(36),code,symbol:sym,name});document.getElementById('new-cur-code').value='';document.getElementById('new-cur-symbol').value='';document.getElementById('new-cur-name').value='';saveCfg();renderAll();cfgMsg('Moneda agregada.','ok');};
window.addCategory=()=>{const name=document.getElementById('new-cat-name').value.trim(),icon=document.getElementById('new-cat-icon').value.trim()||'🏷';if(!name){cfgMsg('Ingresá un nombre.','err');return;}cfg.categories.push({id:'c'+Date.now().toString(36),name,icon});document.getElementById('new-cat-name').value='';document.getElementById('new-cat-icon').value='';saveCfg();renderAll();cfgMsg('Categoría agregada.','ok');};

function cfgMsg(m,t){const el=document.getElementById('config-msg');el.textContent=m;el.className='msg '+(t==='ok'?'ok':'err');setTimeout(()=>{el.textContent='';},2500);}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

async function bootstrap(){
  setSyncStatus('loading','Conectando...');
  try{
    const snap=await getDoc(cfgRef);
    if(snap.exists())cfg=Object.assign(cfg,snap.data());
    else await setDoc(cfgRef,cfg);
    document.getElementById('f-date').value=new Date().toISOString().slice(0,10);
    const q=query(recRef,orderBy('date','desc'));
    onSnapshot(q,snapshot=>{
      records=snapshot.docs.map(d=>({id:d.id,...d.data()}));
      renderAll();setSyncStatus('ok','Sincronizado');
    },()=>setSyncStatus('err','Error de conexión'));
    document.getElementById('loading-screen').style.display='none';
    document.getElementById('main-app').style.display='block';
  }catch(e){
    document.getElementById('loading-screen').innerHTML='<div style="text-align:center;padding:2rem;color:var(--red)"><div style="font-size:18px;margin-bottom:8px">Error de conexión</div><div style="font-size:13px;color:var(--text2);margin-bottom:16px">Verificá tu conexión e intentá recargar.</div><button onclick="location.reload()" style="padding:8px 20px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:none;cursor:pointer;font-size:14px;font-family:var(--font)">Reintentar</button></div>';
  }
}

bootstrap();
</script>
</body>
</html>
