<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Gastos Familiares</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f5f4f0;--surface:#ffffff;--surface2:#f0efe9;
  --border:rgba(0,0,0,0.10);--border2:rgba(0,0,0,0.18);
  --text:#1a1a18;--text2:#6b6b66;--text3:#9e9e99;
  --green:#3B6D11;--green-bg:#EAF3DE;
  --blue:#185FA5;--blue-bg:#E6F1FB;
  --amber:#854F0B;--amber-bg:#FAEEDA;
  --red:#A32D2D;--red-bg:#FCEBEB;
  --purple:#534AB7;--purple-bg:#EEEDFE;
  --pink:#993556;--pink-bg:#FBEAF0;
  --gray:#5F5E5A;--gray-bg:#F1EFE8;
  --teal:#0F6E56;--teal-bg:#E1F5EE;
  --radius:12px;--radius-sm:8px;
  --font:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1a1a18;--surface:#242422;--surface2:#2e2e2b;
    --border:rgba(255,255,255,0.10);--border2:rgba(255,255,255,0.18);
    --text:#f0efe9;--text2:#9e9e99;--text3:#6b6b66;
    --green:#a8d96a;--green-bg:#1e3308;
    --blue:#7eb8f5;--blue-bg:#0a2240;
    --amber:#f5c878;--amber-bg:#2e1c04;
    --red:#f08080;--red-bg:#2e0e0e;
    --purple:#b8b4f0;--purple-bg:#1e1b40;
    --pink:#e89ab4;--pink-bg:#2a0e1a;
    --gray:#b4b2a9;--gray-bg:#28281e;
    --teal:#5dcaa5;--teal-bg:#04342c;
  }
}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5;min-height:100vh;}
.app{max-width:700px;margin:0 auto;padding:1.25rem 1rem 3rem;}
.header{margin-bottom:1.25rem;}
.header h1{font-size:22px;font-weight:600;color:var(--text);}
.header p{font-size:13px;color:var(--text2);margin-top:3px;}
.sync-status{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);margin-top:4px;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);}
.sync-dot.ok{background:var(--green);}
.sync-dot.err{background:var(--red);}
.sync-dot.loading{background:var(--amber);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
.tabs{display:flex;margin-bottom:1.5rem;border-bottom:1px solid var(--border);overflow-x:auto;}
.tab{padding:9px 15px;font-size:13px;cursor:pointer;border:none;background:none;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;font-family:var(--font);white-space:nowrap;flex-shrink:0;}
.tab.active{color:var(--text);border-bottom-color:var(--text);font-weight:600;}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:1.25rem;}
.metric{background:var(--surface2);border-radius:var(--radius-sm);padding:12px 14px;}
.metric-label{font-size:11px;color:var(--text2);margin-bottom:3px;}
.metric-value{font-size:16px;font-weight:600;color:var(--text);line-height:1.3;}
.metric-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1.25rem;}
.card-title{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:12px;letter-spacing:0.05em;text-transform:uppercase;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.form-grid-4{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:10px;}
.ff label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:500;}
.ff input,.ff select{width:100%;padding:9px 11px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;background:var(--surface2);color:var(--text);font-family:var(--font);-webkit-appearance:none;}
.ff input:focus,.ff select:focus{outline:none;border-color:var(--blue);}
.btn{padding:8px 16px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;cursor:pointer;background:none;color:var(--text);font-family:var(--font);}
.btn:hover{background:var(--surface2);}
.btn-primary{width:100%;padding:11px;background:var(--text);color:var(--surface);border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);margin-top:6px;}
.btn-primary:hover{opacity:0.85;}
.btn-sm{padding:4px 10px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;background:none;color:var(--text2);font-family:var(--font);}
.btn-danger{color:var(--red);border-color:rgba(162,45,45,0.3);}
.btn-danger:hover{background:var(--red-bg);}
.filter-row{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap;}
.filter-btn{padding:5px 13px;font-size:12px;border:1px solid var(--border2);border-radius:20px;cursor:pointer;background:none;color:var(--text2);font-family:var(--font);}
.filter-btn.active{background:var(--text);color:var(--surface);border-color:var(--text);}
.expense-list{display:flex;flex-direction:column;gap:7px;}
.expense-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;gap:12px;}
.exp-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.exp-main{flex:1;min-width:0;}
.exp-desc{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.exp-meta{font-size:11px;color:var(--text2);margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.exp-right{text-align:right;flex-shrink:0;}
.exp-amount{font-size:15px;font-weight:600;color:var(--text);}
.exp-person{font-size:11px;color:var(--text3);margin-top:1px;}
.btn-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:20px;padding:2px 4px;line-height:1;flex-shrink:0;}
.btn-del:hover{color:var(--red);}
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:500;}
.cur-badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600;border:1px solid var(--border);}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.bar-label{font-size:12px;color:var(--text2);width:100px;flex-shrink:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-track{flex:1;height:7px;background:var(--surface2);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;transition:width 0.5s ease;}
.bar-val{font-size:11px;font-weight:500;color:var(--text);min-width:80px;text-align:right;}
.currency-section{margin-bottom:1.5rem;}
.currency-section-header{font-size:11px;font-weight:600;color:var(--text2);letter-spacing:0.05em;text-transform:uppercase;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.balance-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:8px;}
.balance-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;}
.bal-name{font-size:12px;color:var(--text2);margin-bottom:7px;display:flex;align-items:center;gap:7px;font-weight:500;}
.bal-line{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;}
.bal-cur{font-size:11px;color:var(--text3);}
.bal-diff{font-size:14px;font-weight:600;}
.pos{color:var(--green);} .neg{color:var(--red);} .zero{color:var(--text3);}
.avatar{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0;}
.settle-item{font-size:13px;padding:7px 0;border-bottom:1px solid var(--border);color:var(--text);}
.settle-item:last-child{border-bottom:none;}
.empty{text-align:center;padding:3rem 1rem;color:var(--text3);font-size:14px;}
.config-section{margin-bottom:1.5rem;}
.config-section-title{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:10px;letter-spacing:0.05em;text-transform:uppercase;}
.config-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.config-row input{flex:1;padding:7px 10px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;background:var(--surface2);color:var(--text);font-family:var(--font);}
.config-row input:focus{outline:none;border-color:var(--blue);}
.add-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
.add-row input{flex:1;padding:7px 10px;border:1px dashed var(--border2);border-radius:var(--radius-sm);font-size:14px;background:none;color:var(--text);font-family:var(--font);}
.add-row input:focus{outline:none;border-color:var(--blue);border-style:solid;}
.msg{text-align:center;font-size:13px;min-height:18px;margin-top:8px;}
.msg.ok{color:var(--green);} .msg.err{color:var(--red);}
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:12px;color:var(--text2);font-size:14px;}
.spinner{width:28px;height:28px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:10px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;z-index:999;opacity:0;transition:opacity 0.2s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
@media(max-width:500px){.form-grid,.form-grid-4{grid-template-columns:1fr;}.metrics{grid-template-columns:1fr 1fr;}.app{padding:1rem 0.75rem 3rem;}}
</style>
</head>
<body>

<div id="loading-screen" class="loading-screen">
  <div class="spinner"></div>
  <span>Conectando con Firebase...</span>
</div>

<div id="main-app" class="app" style="display:none">
  <div class="header">
    <h1>Gastos familiares</h1>
    <p id="header-sub">Registro compartido</p>
    <div class="sync-status">
      <div class="sync-dot loading" id="sync-dot"></div>
      <span id="sync-label">Conectando...</span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('resumen')">Resumen</button>
    <button class="tab" onclick="showTab('nuevo')">Nuevo gasto</button>
    <button class="tab" onclick="showTab('historial')">Historial</button>
    <button class="tab" onclick="showTab('balances')">Balances</button>
    <button class="tab" onclick="showTab('config')">Configuración</button>
  </div>

  <div id="tab-resumen">
    <div class="metrics" id="metrics"></div>
    <div class="card"><div class="card-title">Por categoría</div><div id="cat-bars"></div></div>
    <div class="card"><div class="card-title">Por persona</div><div id="person-bars"></div></div>
  </div>

  <div id="tab-nuevo" style="display:none">
    <div class="card">
      <div class="form-grid-4">
        <div class="ff"><label>Descripción</label><input type="text" id="f-desc" placeholder="Ej: Supermercado"/></div>
        <div class="ff"><label>Monto</label><input type="number" id="f-amount" placeholder="0" min="0" step="0.01"/></div>
        <div class="ff"><label>Moneda</label><select id="f-currency"></select></div>
        <div class="ff"><label>Categoría</label><select id="f-cat"></select></div>
      </div>
      <div class="form-grid">
        <div class="ff"><label>Pagado por</label><select id="f-person"></select></div>
        <div class="ff"><label>Fecha</label><input type="date" id="f-date"/></div>
      </div>
      <button class="btn-primary" onclick="addExpense()">Registrar gasto</button>
      <div id="form-msg" class="msg"></div>
    </div>
  </div>

  <div id="tab-historial" style="display:none">
    <div class="filter-row" id="hist-filters"></div>
    <div class="expense-list" id="expense-list"></div>
  </div>

  <div id="tab-balances" style="display:none">
    <p style="font-size:13px;color:var(--text2);margin-bottom:1rem;">Gastos y diferencias por moneda — cada una se calcula por separado.</p>
    <div id="balances-content"></div>
  </div>

  <div id="tab-config" style="display:none">
    <div class="card">
      <div class="config-section">
        <div class="config-section-title">Personas</div>
        <div id="people-config"></div>
      </div>
      <div class="config-section">
        <div class="config-section-title">Monedas</div>
        <div id="currencies-config"></div>
        <div class="add-row">
          <input type="text" id="new-cur-code" placeholder="Código (ej: BRL)" style="max-width:120px;flex-shrink:0;text-transform:uppercase;"/>
          <input type="text" id="new-cur-symbol" placeholder="Símbolo (ej: R$)" style="max-width:90px;flex-shrink:0;"/>
          <input type="text" id="new-cur-name" placeholder="Nombre completo"/>
          <button class="btn" onclick="addCurrency()">+ Agregar</button>
        </div>
      </div>
      <div class="config-section" style="margin-bottom:0">
        <div class="config-section-title">Categorías</div>
        <div id="cats-config"></div>
        <div class="add-row">
          <input type="text" id="new-cat-icon" placeholder="🏷" style="max-width:52px;flex-shrink:0;text-align:center;font-size:18px;"/>
          <input type="text" id="new-cat-name" placeholder="Nueva categoría..."/>
          <button class="btn" onclick="addCategory()">+ Agregar</button>
        </div>
      </div>
      <div id="config-msg" class="msg" style="margin-top:14px;"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, addDoc, deleteDoc, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyCDGDaGmZ9XdXJXvSqTRTeDATFDUIaPfZM",
  authDomain: "gastos-familiares-a8055.firebaseapp.com",
  projectId: "gastos-familiares-a8055",
  storageBucket: "gastos-familiares-a8055.firebasestorage.app",
  messagingSenderId: "189480541992",
  appId: "1:189480541992:web:19b59db6272872a3303a1d"
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

const AV_COLORS=[
  {bg:'#E6F1FB',color:'#185FA5'},{bg:'#EAF3DE',color:'#3B6D11'},
  {bg:'#FAEEDA',color:'#854F0B'},{bg:'#FBEAF0',color:'#993556'},
  {bg:'#EEEDFE',color:'#534AB7'},{bg:'#F1EFE8',color:'#5F5E5A'},
  {bg:'#FCEBEB',color:'#A32D2D'},{bg:'#E1F5EE',color:'#0F6E56'}
];
const BAR_COLORS=['#378ADD','#639922','#BA7517','#D4537E','#7F77DD','#888780','#E24B4A','#1D9E75'];
const CAT_COLORS=['#3B6D11','#185FA5','#854F0B','#A32D2D','#534AB7','#993556','#5F5E5A','#0F6E56'];
const CAT_BGS=['#EAF3DE','#E6F1FB','#FAEEDA','#FCEBEB','#EEEDFE','#FBEAF0','#F1EFE8','#E1F5EE'];
const CUR_COLORS=['#185FA5','#3B6D11','#534AB7','#854F0B','#993556','#A32D2D','#0F6E56','#5F5E5A'];
const CUR_BGS=['#E6F1FB','#EAF3DE','#EEEDFE','#FAEEDA','#FBEAF0','#FCEBEB','#E1F5EE','#F1EFE8'];

let config = {
  people: ['Ana','Bruno','Carlos','Diana'],
  currencies: [
    {id:'uyu',code:'UYU',symbol:'$U',name:'Peso uruguayo'},
    {id:'usd',code:'USD',symbol:'US$',name:'Dólar'},
    {id:'eur',code:'EUR',symbol:'€',name:'Euro'}
  ],
  categories: [
    {id:'c1',name:'Comida',icon:'🍽'},{id:'c2',name:'Hogar',icon:'🏠'},
    {id:'c3',name:'Transporte',icon:'🚌'},{id:'c4',name:'Salud',icon:'💊'},
    {id:'c5',name:'Educación',icon:'📚'},{id:'c6',name:'Ocio',icon:'🎮'},
    {id:'c7',name:'Otros',icon:'📦'}
  ]
};
let expenses = [];
let filterPerson = 'all';

const configRef = doc(db, 'app', 'config');
const expensesRef = collection(db, 'expenses');

// ── Helpers ──────────────────────────────────────────────────────
const setSyncStatus = (state, label) => {
  document.getElementById('sync-dot').className = 'sync-dot ' + state;
  document.getElementById('sync-label').textContent = label;
};
const catById = id => config.categories.find(c=>c.id===id) || {name:'Otros',icon:'📦',id:'?'};
const catCI = id => { const i=config.categories.findIndex(c=>c.id===id); return i>=0?i%CAT_COLORS.length:0; };
const curById = id => config.currencies.find(c=>c.id===id) || {code:'?',symbol:'?',name:'?'};
const curCI = id => { const i=config.currencies.findIndex(c=>c.id===id); return i>=0?i%CUR_COLORS.length:0; };
const fmtD = n => (Math.round(n*100)/100).toLocaleString('es-UY',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt = n => Math.round(n).toLocaleString('es-UY');
const fmtDate = d => new Date(d+'T12:00:00').toLocaleDateString('es-UY',{day:'2-digit',month:'short',year:'2-digit'});
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const groupByCur = exps => { const m={}; exps.forEach(e=>{m[e.curId]=(m[e.curId]||0)+e.amount;}); return m; };
const showToast = msg => { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); };
const showConfigMsg = (msg,type) => { const el=document.getElementById('config-msg'); el.textContent=msg; el.className='msg '+(type==='ok'?'ok':'err'); setTimeout(()=>{el.textContent='';},2500); };

// ── Save config to Firestore ─────────────────────────────────────
async function saveConfig() {
  setSyncStatus('loading','Guardando...');
  try { await setDoc(configRef, config); setSyncStatus('ok','Sincronizado'); }
  catch(e) { setSyncStatus('err','Error al guardar'); }
}

// ── Render ───────────────────────────────────────────────────────
function renderAll() {
  document.getElementById('header-sub').textContent = 'Registro compartido · ' + config.people.join(', ');
  renderMetrics(); renderCatBars(); renderPersonBars();
  buildSelects(); renderHistFilters(); renderList(); renderBalances(); renderConfig();
}

function renderMetrics() {
  const n=expenses.length, now=new Date();
  const mes=expenses.filter(e=>{const d=new Date(e.date+'T12:00');return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();});
  const totStr=Object.entries(groupByCur(expenses)).map(([id,v])=>curById(id).symbol+' '+fmt(v)).join('  +  ')||'—';
  const mesStr=Object.entries(groupByCur(mes)).map(([id,v])=>curById(id).symbol+' '+fmt(v)).join('  +  ')||'—';
  const pTotals=config.people.map((_,i)=>expenses.filter(e=>e.personIdx===i).reduce((s,e)=>s+e.amount,0));
  const maxIdx=pTotals.indexOf(Math.max(...pTotals));
  document.getElementById('metrics').innerHTML=`
    <div class="metric"><div class="metric-label">Total registrado</div><div class="metric-value" style="font-size:13px;line-height:1.6">${totStr}</div><div class="metric-sub">${n} gastos</div></div>
    <div class="metric"><div class="metric-label">Este mes</div><div class="metric-value" style="font-size:13px;line-height:1.6">${mesStr}</div><div class="metric-sub">${mes.length} gastos</div></div>
    <div class="metric"><div class="metric-label">Mayor gastador</div><div class="metric-value">${n?(config.people[maxIdx]||'—'):'—'}</div></div>
    <div class="metric"><div class="metric-label">Gastos cargados</div><div class="metric-value">${n}</div><div class="metric-sub">${config.currencies.filter(c=>expenses.some(e=>e.curId===c.id)).length} moneda(s)</div></div>`;
}

function renderCatBars() {
  const map={};
  expenses.forEach(e=>{if(!map[e.catId])map[e.catId]={};map[e.catId][e.curId]=(map[e.catId][e.curId]||0)+e.amount;});
  const entries=Object.entries(map);
  if(!entries.length){document.getElementById('cat-bars').innerHTML='<div class="empty">Sin datos aún</div>';return;}
  const totals=entries.map(([,m])=>Object.values(m).reduce((s,v)=>s+v,0));
  const maxT=Math.max(...totals,1);
  document.getElementById('cat-bars').innerHTML=entries.map(([catId,byCur],i)=>{
    const cat=catById(catId),ci=catCI(catId);
    const valStr=Object.entries(byCur).map(([cid,v])=>curById(cid).symbol+' '+fmt(v)).join(' · ');
    return`<div class="bar-row"><div class="bar-label">${cat.icon} ${cat.name}</div><div class="bar-track"><div class="bar-fill" style="width:${(totals[i]/maxT*100).toFixed(1)}%;background:${CAT_COLORS[ci]}"></div></div><div class="bar-val">${valStr}</div></div>`;
  }).join('');
}

function renderPersonBars() {
  const data=config.people.map((_,i)=>groupByCur(expenses.filter(e=>e.personIdx===i)));
  const allT=data.map(m=>Object.values(m).reduce((s,v)=>s+v,0));
  const maxT=Math.max(...allT,1);
  document.getElementById('person-bars').innerHTML=config.people.map((p,i)=>{
    const valStr=Object.entries(data[i]).map(([cid,v])=>curById(cid).symbol+' '+fmt(v)).join(' · ')||'—';
    return`<div class="bar-row"><div class="bar-label">${p}</div><div class="bar-track"><div class="bar-fill" style="width:${(allT[i]/maxT*100).toFixed(1)}%;background:${BAR_COLORS[i%BAR_COLORS.length]}"></div></div><div class="bar-val">${valStr}</div></div>`;
  }).join('');
}

function buildSelects() {
  const fp=document.getElementById('f-person'),pv=fp.value;
  fp.innerHTML=config.people.map((p,i)=>`<option value="${i}">${p}</option>`).join('');
  if(pv!==''&&pv<config.people.length)fp.value=pv;
  const fc=document.getElementById('f-cat'),cv=fc.value;
  fc.innerHTML=config.categories.map(c=>`<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
  if(cv&&config.categories.find(c=>c.id===cv))fc.value=cv;
  const fcur=document.getElementById('f-currency'),curv=fcur.value;
  fcur.innerHTML=config.currencies.map(c=>`<option value="${c.id}">${c.code} — ${c.symbol}</option>`).join('');
  if(curv&&config.currencies.find(c=>c.id===curv))fcur.value=curv;
}

function renderHistFilters() {
  const btns=[{label:'Todos',val:'all'},...config.people.map((p,i)=>({label:p,val:String(i)}))];
  document.getElementById('hist-filters').innerHTML=btns.map(b=>`<button class="filter-btn${filterPerson===b.val?' active':''}" onclick="setFilter('${b.val}',this)">${b.label}</button>`).join('');
}

function renderList() {
  const filtered=filterPerson==='all'?expenses:expenses.filter(e=>e.personIdx==filterPerson);
  const sorted=[...filtered].sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!sorted.length){document.getElementById('expense-list').innerHTML='<div class="empty">No hay gastos registrados</div>';return;}
  document.getElementById('expense-list').innerHTML=sorted.map(e=>{
    const cat=catById(e.catId),ci=catCI(e.catId),cur=curById(e.curId),curi=curCI(e.curId);
    return`<div class="expense-item">
      <div class="exp-icon" style="background:${CAT_BGS[ci]}">${cat.icon}</div>
      <div class="exp-main">
        <div class="exp-desc">${esc(e.desc)}</div>
        <div class="exp-meta">
          <span class="badge" style="background:${CAT_BGS[ci]};color:${CAT_COLORS[ci]}">${cat.name}</span>
          <span class="cur-badge" style="background:${CUR_BGS[curi]};color:${CUR_COLORS[curi]}">${cur.code}</span>
          ${fmtDate(e.date)}
        </div>
      </div>
      <div class="exp-right">
        <div class="exp-amount">${cur.symbol} ${fmtD(e.amount)}</div>
        <div class="exp-person">${config.people[e.personIdx]||'?'}</div>
      </div>
      <button class="btn-del" onclick="delExpense('${e.id}')">×</button>
    </div>`;
  }).join('');
}

function renderBalances() {
  const activeCurs=config.currencies.filter(c=>expenses.some(e=>e.curId===c.id));
  if(!activeCurs.length){document.getElementById('balances-content').innerHTML='<div class="empty">No hay gastos registrados</div>';return;}
  let html='';
  activeCurs.forEach(cur=>{
    const exps=expenses.filter(e=>e.curId===cur.id);
    const total=exps.reduce((s,e)=>s+e.amount,0);
    const share=total/(config.people.length||1);
    const diffs=config.people.map((p,i)=>{const paid=exps.filter(e=>e.personIdx===i).reduce((s,e)=>s+e.amount,0);return{name:p,paid,diff:paid-share,idx:i};});
    html+=`<div class="currency-section">
      <div class="currency-section-header">${cur.code} — ${cur.name} &nbsp;·&nbsp; Total: ${cur.symbol} ${fmtD(total)} &nbsp;·&nbsp; Por persona: ${cur.symbol} ${fmtD(share)}</div>
      <div class="balance-grid">${diffs.map(d=>{
        const av=AV_COLORS[d.idx%AV_COLORS.length];
        const cls=Math.abs(d.diff)<0.5?'zero':d.diff>0?'pos':'neg';
        const sign=d.diff>=0.5?'+':d.diff<=-0.5?'-':'';
        return`<div class="balance-card">
          <div class="bal-name"><div class="avatar" style="background:${av.bg};color:${av.color}">${d.name.slice(0,2).toUpperCase()}</div>${d.name}</div>
          <div class="bal-line"><span class="bal-cur">Pagó</span><span style="font-size:13px;font-weight:600;color:var(--text)">${cur.symbol} ${fmtD(d.paid)}</span></div>
          <div class="bal-line"><span class="bal-cur">Diferencia</span><span class="bal-diff ${cls}">${sign}${cur.symbol} ${fmtD(Math.abs(d.diff))}</span></div>
        </div>`;
      }).join('')}</div>`;
    const debtors=diffs.filter(d=>d.diff<-0.5).map(d=>({...d})).sort((a,b)=>a.diff-b.diff);
    const creditors=diffs.filter(d=>d.diff>0.5).map(d=>({...d})).sort((a,b)=>b.diff-a.diff);
    let settles=[];
    while(debtors.length&&creditors.length){
      const deb=debtors[0],cred=creditors[0],amt=Math.min(Math.abs(deb.diff),cred.diff);
      if(amt>0.5)settles.push(`${deb.name} le debe ${cur.symbol} ${fmtD(amt)} a ${cred.name}`);
      deb.diff+=amt;cred.diff-=amt;
      if(Math.abs(deb.diff)<0.5)debtors.shift();
      if(cred.diff<0.5)creditors.shift();
    }
    html+=settles.length
      ?`<div style="margin-bottom:0.5rem">${settles.map(s=>`<div class="settle-item">↳ ${s}</div>`).join('')}</div>`
      :`<div style="font-size:13px;color:var(--green);padding:4px 0;margin-bottom:0.5rem">✓ Todos en equilibrio en ${cur.code}</div>`;
    html+='</div>';
  });
  document.getElementById('balances-content').innerHTML=html;
}

function renderConfig() {
  document.getElementById('people-config').innerHTML=config.people.map((p,i)=>`
    <div class="config-row">
      <div class="avatar" style="background:${AV_COLORS[i%AV_COLORS.length].bg};color:${AV_COLORS[i%AV_COLORS.length].color};width:28px;height:28px;font-size:11px;flex-shrink:0">${p.slice(0,2).toUpperCase()}</div>
      <input type="text" value="${esc(p)}" onchange="updatePerson(${i},this.value)" placeholder="Nombre"/>
    </div>`).join('');
  document.getElementById('currencies-config').innerHTML=config.currencies.map((c,i)=>`
    <div class="config-row">
      <span class="cur-badge" style="background:${CUR_BGS[i%CUR_BGS.length]};color:${CUR_COLORS[i%CUR_COLORS.length]};font-size:12px;padding:4px 8px;flex-shrink:0">${c.code}</span>
      <input type="text" value="${esc(c.symbol)}" onchange="updateCurSymbol('${c.id}',this.value)" style="max-width:75px;flex-shrink:0;" placeholder="Símbolo"/>
      <input type="text" value="${esc(c.name)}" onchange="updateCurName('${c.id}',this.value)" placeholder="Nombre"/>
      ${config.currencies.length>1?`<button class="btn-sm btn-danger" onclick="deleteCurrency('${c.id}')">Eliminar</button>`:''}
    </div>`).join('');
  document.getElementById('cats-config').innerHTML=config.categories.map((c)=>`
    <div class="config-row">
      <input type="text" value="${c.icon}" onchange="updateCatIcon('${c.id}',this.value)" style="width:46px;flex-shrink:0;text-align:center;font-size:18px;padding:5px 4px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);font-family:var(--font);"/>
      <input type="text" value="${esc(c.name)}" onchange="updateCatName('${c.id}',this.value)" style="flex:1;padding:7px 10px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;background:var(--surface2);color:var(--text);font-family:var(--font);"/>
      ${config.categories.length>1?`<button class="btn-sm btn-danger" onclick="deleteCat('${c.id}')">Eliminar</button>`:''}
    </div>`).join('');
}

// ── Actions ──────────────────────────────────────────────────────
window.addExpense = async () => {
  const desc=document.getElementById('f-desc').value.trim();
  const amount=parseFloat(document.getElementById('f-amount').value);
  const curId=document.getElementById('f-currency').value;
  const catId=document.getElementById('f-cat').value;
  const personIdx=parseInt(document.getElementById('f-person').value);
  const date=document.getElementById('f-date').value;
  const msg=document.getElementById('form-msg');
  if(!desc){msg.className='msg err';msg.textContent='Ingresá una descripción.';return;}
  if(!amount||amount<=0){msg.className='msg err';msg.textContent='Ingresá un monto válido.';return;}
  if(!date){msg.className='msg err';msg.textContent='Seleccioná una fecha.';return;}
  msg.className='msg';msg.textContent='Guardando...';
  try {
    await addDoc(expensesRef,{desc,amount,curId,catId,personIdx,date,createdAt:Date.now()});
    document.getElementById('f-desc').value='';
    document.getElementById('f-amount').value='';
    msg.className='msg ok';msg.textContent='Gasto registrado.';
    setTimeout(()=>{msg.textContent='';},2000);
    showToast('Gasto registrado ✓');
  } catch(e){msg.className='msg err';msg.textContent='Error al guardar. Revisá tu conexión.';}
};

window.delExpense = async id => {
  try{await deleteDoc(doc(db,'expenses',id));showToast('Gasto eliminado');}
  catch(e){showToast('Error al eliminar');}
};

window.setFilter = (f,btn) => {
  filterPerson=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');renderList();
};

window.showTab = t => {
  ['resumen','nuevo','historial','balances','config'].forEach(id=>{
    document.getElementById('tab-'+id).style.display=id===t?'':'none';
    document.querySelector(`.tab[onclick="showTab('${id}')"]`).classList.toggle('active',id===t);
  });
};

window.updatePerson=(idx,val)=>{val=val.trim();if(!val)return;config.people[idx]=val;saveConfig();renderAll();showConfigMsg('Nombre actualizado.','ok');};
window.updateCurSymbol=(id,val)=>{const c=config.currencies.find(x=>x.id===id);if(c){c.symbol=val.trim()||c.symbol;saveConfig();renderAll();}};
window.updateCurName=(id,val)=>{val=val.trim();if(!val)return;const c=config.currencies.find(x=>x.id===id);if(c){c.name=val;saveConfig();renderAll();showConfigMsg('Moneda actualizada.','ok');}};
window.updateCatName=(id,val)=>{val=val.trim();if(!val)return;const c=config.categories.find(x=>x.id===id);if(c){c.name=val;saveConfig();renderAll();showConfigMsg('Categoría actualizada.','ok');}};
window.updateCatIcon=(id,val)=>{const c=config.categories.find(x=>x.id===id);if(c){c.icon=val||'📦';saveConfig();renderAll();}};
window.deleteCurrency=id=>{
  if(config.currencies.length<=1){showConfigMsg('Debe quedar al menos una moneda.','err');return;}
  if(expenses.some(e=>e.curId===id)){showConfigMsg('No se puede eliminar: hay gastos en esta moneda.','err');return;}
  config.currencies=config.currencies.filter(c=>c.id!==id);saveConfig();renderAll();showConfigMsg('Moneda eliminada.','ok');
};
window.deleteCat=id=>{
  if(config.categories.length<=1){showConfigMsg('Debe quedar al menos una categoría.','err');return;}
  if(expenses.some(e=>e.catId===id)){showConfigMsg('No se puede eliminar: hay gastos con esta categoría.','err');return;}
  config.categories=config.categories.filter(c=>c.id!==id);saveConfig();renderAll();showConfigMsg('Categoría eliminada.','ok');
};
window.addCurrency=()=>{
  const code=document.getElementById('new-cur-code').value.trim().toUpperCase();
  const symbol=document.getElementById('new-cur-symbol').value.trim();
  const name=document.getElementById('new-cur-name').value.trim();
  if(!code||!symbol||!name){showConfigMsg('Completá código, símbolo y nombre.','err');return;}
  if(config.currencies.find(c=>c.code===code)){showConfigMsg('Ya existe una moneda con ese código.','err');return;}
  config.currencies.push({id:'cur'+Date.now().toString(36),code,symbol,name});
  document.getElementById('new-cur-code').value='';
  document.getElementById('new-cur-symbol').value='';
  document.getElementById('new-cur-name').value='';
  saveConfig();renderAll();showConfigMsg('Moneda agregada.','ok');
};
window.addCategory=()=>{
  const name=document.getElementById('new-cat-name').value.trim();
  const icon=document.getElementById('new-cat-icon').value.trim()||'🏷';
  if(!name){showConfigMsg('Ingresá un nombre para la categoría.','err');return;}
  config.categories.push({id:'c'+Date.now().toString(36),name,icon});
  document.getElementById('new-cat-name').value='';
  document.getElementById('new-cat-icon').value='';
  saveConfig();renderAll();showConfigMsg('Categoría agregada.','ok');
};

// ── Bootstrap ────────────────────────────────────────────────────
async function bootstrap() {
  setSyncStatus('loading','Conectando...');
  try {
    const snap = await getDoc(configRef);
    if(snap.exists()){config={...config,...snap.data()};}
    else{await setDoc(configRef,config);}
    document.getElementById('f-date').value=new Date().toISOString().slice(0,10);
    const q=query(expensesRef,orderBy('date','desc'));
    onSnapshot(q, snapshot=>{
      expenses=snapshot.docs.map(d=>({id:d.id,...d.data()}));
      renderAll();
      setSyncStatus('ok','Sincronizado');
    }, ()=>setSyncStatus('err','Error de conexión'));
    document.getElementById('loading-screen').style.display='none';
    document.getElementById('main-app').style.display='block';
  } catch(e) {
    document.getElementById('loading-screen').innerHTML=
      '<div style="text-align:center;padding:2rem;color:#A32D2D">'+
      '<div style="font-size:18px;margin-bottom:8px">Error de conexión</div>'+
      '<div style="font-size:13px;color:#6b6b66;margin-bottom:16px">Verificá tu conexión a internet e intentá recargar.</div>'+
      '<button onclick="location.reload()" style="padding:8px 20px;border:1px solid #ccc;border-radius:8px;background:none;cursor:pointer;font-size:14px;font-family:inherit">Reintentar</button></div>';
  }
}

bootstrap();
</script>
